# Single-command local run:  docker compose up --build
# Then open http://localhost:8000
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Persist SQLite to a mounted volume so data survives restarts.
      DATABASE_URL: sqlite:////app/data/yuno.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
